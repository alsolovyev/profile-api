name: profile-app-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: profile_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 15


  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: profile_test
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
